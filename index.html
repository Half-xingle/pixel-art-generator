<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 像素画工坊</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>🎨 像素画工坊</h1>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="convert">转换</button>
      <button class="tab-btn" data-tab="draw">绘画</button>
    </nav>
  </header>

  <main>
    <!-- Convert Tab -->
    <section id="tab-convert" class="tab-content active">
      <div class="convert-layout">
        <div class="upload-area" id="upload-area">
          <div class="upload-placeholder">
            <p>拖拽图片到这里，或点击选择</p>
            <input type="file" id="file-input" accept="image/*" hidden>
          </div>
          <img id="preview-original" class="preview-img" hidden>
        </div>
        <div class="result-area">
          <canvas id="canvas-convert" hidden></canvas>
          <p class="empty-hint" id="convert-hint">上传图片后点击"转换"</p>
        </div>
      </div>
      <div class="controls">
        <label>宽：<input type="number" id="convert-width" value="16" min="1" max="256" style="width:60px"></label>
        <label>高：<input type="number" id="convert-height" value="16" min="1" max="256" style="width:60px"></label>
        <span class="ratio-label">比例：</span>
        <button class="ratio-btn active" data-ratio="auto">自动</button>
        <button class="ratio-btn" data-ratio="1:1">1:1</button>
        <button class="ratio-btn" data-ratio="4:3">4:3</button>
        <button class="ratio-btn" data-ratio="16:9">16:9</button>
        <button class="ratio-btn" data-ratio="3:2">3:2</button>
        <button id="btn-convert" class="btn-primary">转换</button>
        <button id="btn-export-convert" class="btn-secondary" disabled>导出 PNG</button>
      </div>
    </section>

    <!-- Draw Tab -->
    <section id="tab-draw" class="tab-content">
      <div class="draw-area">
        <canvas id="canvas-draw"></canvas>
      </div>
      <div class="controls">
        <label>颜色：<input type="color" id="draw-color" value="#ff0000"></label>
        <button id="btn-eraser" class="btn-secondary">橡皮擦</button>
        <button id="btn-clear" class="btn-secondary">清空</button>
        <label>宽：<input type="number" id="draw-width" value="16" min="1" max="128" style="width:60px"></label>
        <label>高：<input type="number" id="draw-height" value="16" min="1" max="128" style="width:60px"></label>
        <span class="ratio-label">比例：</span>
        <button class="ratio-btn" data-ratio="1:1">1:1</button>
        <button class="ratio-btn" data-ratio="4:3">4:3</button>
        <button class="ratio-btn" data-ratio="16:9">16:9</button>
        <button class="ratio-btn" data-ratio="3:2">3:2</button>
        <button class="ratio-btn" data-ratio="2:3">2:3</button>
        <button class="ratio-btn" data-ratio="3:4">3:4</button>
        <button class="ratio-btn" data-ratio="9:16">9:16</button>
        <button id="btn-export-draw" class="btn-primary">导出 PNG</button>
      </div>
    </section>
  </main>

  <script type="module" src="/main.js"></script>
</body>
</html>
